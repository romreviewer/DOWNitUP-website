server {
    listen 80;
    server_name www.downitup.com;
    return 301 https://downitup.com$request_uri;
}

server {
    listen 80;
    server_name downitup.com;
    root /var/www/downitup;  # adjust to your actual site root
    index index.html;

    # Compress text responses (page speed is a ranking factor)
    gzip on;
    gzip_types text/html text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # Custom 404 page
    error_page 404 /404.html;

    # Repeat these canonical locations in the production TLS server block.
    # Canonical URL policy: no .html suffix or trailing slash (except root).
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    location ~ ^/(.+)/$ {
        return 301 /$1;
    }

    # Directory indexes are served at clean, slashless hub URLs.
    location = /blog {
        try_files /blog/index.html =404;
    }

    # Clean URLs: serve .html files without extension.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Desktop app update API served by the Node process.
    location /checkupdate/downitup/desktop {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
